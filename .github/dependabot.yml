version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      devDependencies:
        patterns:
          - "@types/*"
          - "eslint*"
          - "typescript*"
          - "vitest*"
          - "@vitest/*"
          - "playwright"
          - "@playwright/*"
          - "tsup"
          - "tsx"
        update-types:
          - "minor"
          - "patch"
      coreDependencies:
        patterns:
          - "electron-store"
          - "microdiff"
        update-types:
          - "minor"
          - "patch"
    # Security updates are always created immediately
    security-updates:
      enabled: true

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
